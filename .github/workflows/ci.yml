name: CI

on:
  push:
    branches:
      - main
      - develop
  # Deliberately unfiltered. `branches:` on a pull_request trigger filters by the
  # PR's *base*, so while this said `- main` the only PRs that ran CI were the
  # ones targeting main -- and a stack of PRs targeting each other ran none. All
  # thirteen PRs of the #962 UI redesign merged their way up such a stack, so the
  # regression guards that redesign built (contrast, spacing, widget audit,
  # layout minimums) never once ran on the changes they exist to guard.
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run already going for it. Pushes to
# main/develop are never cancelled: each one is a state of a long-lived branch
# worth a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite runs as two concurrent jobs. UI tests build real wx windows and
  # must run one at a time, in one process; everything else is independent and
  # runs across the runner's cores with pytest-xdist. Together they run every
  # test under tests/ exactly once -- tests/test_ci_guards.py pins the split.
  #
  # Test jobs install only what the tests import (requirements.txt plus the
  # pytest pins from requirements-dev.txt). pyinstaller, mypy, bandit, pip-audit,
  # pydeps and debugpy are for other jobs.
  tests-non-ui:
    name: Tests (non-UI, parallel)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt $(grep -E '^pytest(-[a-z]+)?==' requirements-dev.txt | tr -d '\r')
      # Runs first so a design-system regression is named by a step rather than
      # found somewhere in 3000 results. The run below --ignore's exactly these
      # files, so each runs once. The set (here and in tests-ui) is pinned by
      # tests/test_ci_guards.py, which fails if a path stops existing or the two
      # lists drift apart.
      #
      # WHAT THIS PROTECTS (issue #962): every foreground/background pair in the
      # app against WCAG AA, the categorical chart palette against colour-vision
      # deficiency, the type and spacing scales, the ban on bare wx.StaticBox /
      # wx.Notebook / wx.StaticLine / wx.SplitterWindow / wx.TextCtrl, every
      # button reaching the button system, and the WebView backend the
      # deck-stats charts render on. The live-window half is in tests-ui.
      - name: Design-system guards (issue #962)
        run: >-
          pytest -q
          tests/test_theme_contrast.py
          tests/test_widget_audit.py
          tests/test_stylize.py
          tests/test_section.py
          tests/test_notebook.py
          tests/test_checkbox.py
          tests/test_status_bar.py
          tests/test_native_dark.py
          tests/test_deck_stats_palette.py
          tests/test_visible_defects.py
          tests/test_webview_backend.py
          tests/test_menu_bar_spec.py
          tests/test_preferences_spec.py
          tests/test_window_titles.py
          tests/test_automation_commands.py
          tests/test_console_encoding.py

      - name: Run non-UI tests
        # Default pytest config excludes `network`-marked tests via addopts.
        # Live network tests can be run on demand via the `network-tests`
        # job below (triggered with workflow_dispatch).
        run: >-
          pytest -n auto
          --ignore=tests/ui
          --ignore=tests/test_theme_contrast.py
          --ignore=tests/test_widget_audit.py
          --ignore=tests/test_stylize.py
          --ignore=tests/test_section.py
          --ignore=tests/test_notebook.py
          --ignore=tests/test_checkbox.py
          --ignore=tests/test_status_bar.py
          --ignore=tests/test_native_dark.py
          --ignore=tests/test_deck_stats_palette.py
          --ignore=tests/test_visible_defects.py
          --ignore=tests/test_webview_backend.py
          --ignore=tests/test_menu_bar_spec.py
          --ignore=tests/test_preferences_spec.py
          --ignore=tests/test_window_titles.py
          --ignore=tests/test_automation_commands.py
          --ignore=tests/test_console_encoding.py

  tests-ui:
    name: Tests (UI, serial)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt $(grep -E '^pytest(-[a-z]+)?==' requirements-dev.txt | tr -d '\r')
      # The live-window half of the design-system guards (see tests-non-ui):
      # the enforced window minimums in both locales, live layout overflow in
      # both locales, card-view scroll snapping, and the live widget audit.
      - name: Design-system guards (issue #962, live windows)
        run: >-
          pytest -q
          tests/ui/test_live_widget_audit.py
          tests/ui/test_live_layout_overflow.py
          tests/ui/test_layout_minimums.py
          tests/ui/test_card_view_scroll_snap.py
          tests/ui/test_clamp_to_display.py
          tests/ui/test_inspector_column.py

      - name: Run UI tests
        run: >-
          pytest tests/ui
          --ignore=tests/ui/test_live_widget_audit.py
          --ignore=tests/ui/test_live_layout_overflow.py
          --ignore=tests/ui/test_layout_minimums.py
          --ignore=tests/ui/test_card_view_scroll_snap.py
          --ignore=tests/ui/test_clamp_to_display.py
          --ignore=tests/ui/test_inspector_column.py

  network-tests:
    name: Live Network Tests
    # Live tests that hit real external services (e.g. MTGGoldfish). These
    # are flaky by nature, so we only run them on manual dispatch instead of
    # blocking the default CI path.
    #
    # windows-latest because the suite's conftest imports utils.constants, which
    # imports wx, and wxPython is a Windows-only pin in requirements.txt: on
    # ubuntu this job could not even collect (exit 4, "No module named 'wx'").
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt $(grep -E '^pytest(-[a-z]+)?==' requirements-dev.txt | tr -d '\r')
      - name: Run network-marked tests
        run: pytest -m network

  lint-and-format:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linting tools
        # Only ruff and black, at the versions pinned in requirements-dev.txt,
        # so local and CI versions stay in sync without installing the app.
        run: |
          python -m pip install --upgrade pip
          pip install $(grep -E '^(ruff|black)==' requirements-dev.txt | tr -d '\r')

      - name: Run ruff linter
        run: ruff check .
        continue-on-error: false

      - name: Check code formatting with black
        run: black --check --diff .
        continue-on-error: false

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # mypy is pinned in requirements-dev.txt; install from there so local
        # and CI versions stay aligned.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt || true
          pip install types-Pillow types-requests types-beautifulsoup4 || true

      - name: Run mypy type checker
        # mypy is intentionally advisory (see README "Code Quality"). The job
        # surfaces type warnings without blocking merges while typing coverage
        # is incrementally improved.
        run: mypy --install-types --non-interactive --ignore-missing-imports .
        continue-on-error: true  # Type checking is advisory (documented in README)

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      - name: Run bandit security linter
        run: bandit -r . -ll -f json -o bandit-report.json || bandit -r . -ll
        continue-on-error: false

      - name: Check for vulnerable dependencies
        # Audit the project's pinned runtime + dev requirements explicitly so
        # the report reflects what the app actually ships, not whatever
        # transitive set happens to be installed in the runner image.
        run: |
          pip-audit --desc --requirement requirements.txt
          pip-audit --desc --requirement requirements-dev.txt
        continue-on-error: true  # Advisory - may have false positives

  compile-check:
    name: Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # compileall is in the standard library; nothing to install.
      - name: Check Python syntax
        run: |
          python -m compileall -q . -x '/env/|/\.git/|/build/|/dist/' || exit 1
          echo "✓ All Python files compile successfully"

  dotnet-build:
    name: .NET Build Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore dotnet/MTGOBridge/MTGOBridge.csproj

      - name: Check C# formatting
        run: dotnet format dotnet/MTGOBridge/MTGOBridge.csproj --verify-no-changes --verbosity diagnostic
        continue-on-error: true  # Advisory - don't fail on formatting

      - name: Build MTGOBridge
        run: dotnet build dotnet/MTGOBridge/MTGOBridge.csproj -c Release --no-restore

  # Decides whether this run builds the Windows installer. Pushes to main and
  # develop and manual dispatches always do. A pull request does only when it
  # touches what the build consumes directly: the packaging scripts and spec,
  # the .NET bridge, pinned requirements, the bundled data trees (vendor/,
  # assets/, help/), the entry point, the version file, or this workflow.
  #
  # The tradeoff: a PR that breaks the frozen build some other way (a module the
  # spec cannot see, say) is caught on the push to develop after merge rather
  # than on the PR. Run the workflow by hand on the branch (Actions -> CI -> Run
  # workflow) to build the installer for any PR.
  packaging-changes:
    name: Detect packaging changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Decide whether to build the installer
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"
          pattern='^(packaging/|dotnet/|vendor/|assets/|help/|requirements(-dev)?\.txt$|main\.py$|setup\.py$|pyproject\.toml$|VERSION$|\.github/workflows/ci\.yml$)'
          if echo "$changed" | grep -qE "$pattern"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    # Not gated on the tests: it runs alongside them, so it never adds its ~5
    # minutes after them. A test failure still fails the run.
    needs: packaging-changes
    if: needs.packaging-changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install Inno Setup
        run: |
          choco install innosetup -y
      - name: Build Windows Installer
        run: |
          cd packaging
          .\build_installer.ps1
      - name: Test Installer
        run: |
          cd packaging
          .\test_installer.ps1
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe


  # NOTE: LOC report (LOC_REPORT.md) and dependency graph (docs/diagrams/*)
  # are generated from the whole tree, so every PR would otherwise both
  # conflict on them and fail a freshness gate. Their freshness checks have
  # been removed from PR CI; they are now regenerated and committed once a day
  # by .github/workflows/refresh-reports.yml (and on-demand via that workflow's
  # manual dispatch). See that workflow and CONTRIBUTING/README for details.

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, security-scan, compile-check, dotnet-build]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Validation Results:"
          echo "===================="
          echo "Linting & Formatting: ${{ needs.lint-and-format.result }}"
          echo "Type Checking: ${{ needs.type-check.result }}"
          echo "Security Scanning: ${{ needs.security-scan.result }}"
          echo "Compilation Check: ${{ needs.compile-check.result }}"
          echo ".NET Build: ${{ needs.dotnet-build.result }}"

          if [ "${{ needs.lint-and-format.result }}" != "success" ] || \
             [ "${{ needs.compile-check.result }}" != "success" ] || \
             [ "${{ needs.dotnet-build.result }}" != "success" ]; then
            echo "❌ Critical validation checks failed"
            exit 1
          fi

          echo "✓ All critical checks passed!"

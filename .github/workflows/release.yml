# Decide, record, and publish a release -- all after the merge has landed.
#
# The version a change deserves depends on everything that shipped alongside it,
# and that set is only final once the merge lands. The previous model decided the
# number on the PR branch, which pinned it against a base that then moved; that is
# how `main` once went backwards from 1.4.0 to 1.3.3 and published v1.3.4 *after*
# v1.4.0. So the whole decision happens here, on `main`, in one place:
#
#   1. compute the next version from the newest vX.Y.Z tag + the commits since it
#      (scripts/next_version.py -- inference proposes patch, a `Version-Bump:` or
#      `Release-As:` trailer is what buys a minor or a major)
#   2. record it by committing VERSION to `main`, so the file, the tag, and the
#      installer all agree
#   3. build and verify the installer from that exact commit, then tag + publish
#   4. prune releases back to the newest patch per MAJOR.MINOR line, max 10
#
# Idempotent by construction: the guard is "does the tag v<next> already have a
# release?", so re-running publishes nothing twice, and a build that failed after
# VERSION was recorded is retried by the next push (the recomputed number is the
# same, the file already matches, the missing tag is what triggers the retry).
#
# PUSH ACCESS: `main` requires a PR, so the VERSION commit is pushed with a
# write-scoped deploy key (secret RELEASE_SSH_KEY) that the ruleset lists as a
# bypass actor. That push does re-trigger this workflow, hence the `chore(release):`
# guard on the first job -- without it the run would queue behind itself for nothing.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    name: Decide and record the version
    runs-on: ubuntu-latest
    # Skip the workflow's own VERSION commit; anything else is a real merge.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    outputs:
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: they are the base the next version is computed from
          # Pushes VERSION back to `main`. Falls back to the built-in token when
          # the secret is absent, which is enough to compute but not to record.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute, record, and gate
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(python scripts/next_version.py base)"
          next="$(python scripts/next_version.py next)"
          level="$(python scripts/next_version.py bump)"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Base $base, bump $level, next $next"

          if [ "$next" = "$base" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Nothing release-worthy since \`v$base\`; no release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Already shipped? The tag *and* its release must both exist -- a tag
          # with no release is a build that failed half-way, and retrying it is
          # exactly what should happen.
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null \
             && gh release view "v$next" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "\`v$next\` already shipped; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Record the number on `main` so VERSION, the tag, and the installer
          # agree. Skipped when the file already says it -- which is the case on
          # a retry, and when a PR set it by hand.
          if [ "$(tr -d '[:space:]' < VERSION)" != "$next" ]; then
            python scripts/next_version.py apply
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "chore(release): VERSION $next"
            if ! git push origin "HEAD:main"; then
              # Two very different reasons the push can fail, and they must not
              # be confused: a lost race is routine, a missing deploy key is a
              # silent halt to every future release.
              git fetch --no-tags origin main
              if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)" ]; then
                echo "::error::Could not push VERSION to main, and main has not moved." \
                     "Check the RELEASE_SSH_KEY deploy key and the main ruleset's bypass actors."
                exit 1
              fi
              # `main` moved while we were deciding. That newer push is running
              # this same job with a fuller commit range, so it computes at least
              # this version and publishes it. Bowing out is the correct answer,
              # not a failure.
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "\`main\` moved mid-run; the newer push will release." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### Releasing \`v$next\` (was \`v$base\`, bump: $level)"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build and publish v${{ needs.decide.outputs.version }}
    needs: decide
    if: needs.decide.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      # The exact commit whose VERSION was recorded, not whatever `main` is by
      # the time this ~10-minute Windows job starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y

      # Same build the PR CI exercises, so what ships here is what was tested --
      # including the bundled bulk-data seed, which a release must carry (a
      # seedless install works but cold-starts with a ~130 MB download).
      - name: Build installer
        run: |
          cd packaging
          .\build_installer.ps1

      - name: Verify installer
        run: |
          cd packaging
          .\test_installer.ps1

      # Published so users can verify a 180+ MB unsigned executable they
      # downloaded over the internet. The app is not code-signed yet, so this
      # checksum is currently the only integrity check available to them.
      #
      # The same digest is published twice, for two different readers. The
      # release notes carry it as prose, for a human checking a download by
      # hand. The `.sha256` sidecar asset carries it in `sha256sum` format, for
      # the in-app updater: it downloads this installer and then *executes* it,
      # so it needs an integrity check it can parse with certainty rather than
      # scraping a Markdown body whose wording is free to change.
      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $name = "MTGOTools_Setup_v$env:VERSION.exe"
          # Resolved to an absolute path because the sidecar is written through
          # .NET below, and .NET resolves relative paths against the process
          # working directory rather than PowerShell's current location -- the
          # two agree here, but only by accident of nothing having moved.
          $file = Join-Path (Resolve-Path "dist/installer") $name
          $sha = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLower()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          # `sha256sum` format exactly: lowercase hex, two spaces, filename, one
          # line. Written via WriteAllText rather than Set-Content because the
          # latter ends the line with CRLF on Windows, and a trailing carriage
          # return lands inside the filename for any reader that splits on "\n"
          # (`sha256sum -c` on Linux included). WriteAllText on PowerShell 7
          # defaults to UTF-8 with no BOM; the content is ASCII either way.
          [System.IO.File]::WriteAllText("$file.sha256", "$sha  $name`n")

      # The tag is created here rather than in `decide` so it is only ever
      # written once a verified installer exists -- a failed build leaves no tag
      # behind and the next push retries cleanly.
      - name: Tag and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Absent on a first run, present when a previous publish failed after
          # tagging; either way the tag must end up on this commit.
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag -a "v$VERSION" -m "MTGO Tools v$VERSION"
            git push origin "v$VERSION"
          fi

          cat > notes.md <<EOF
          ## Install

          Download \`MTGOTools_Setup_v$VERSION.exe\` below and run it. It installs
          per-user under \`%LOCALAPPDATA%\\MTGO Tools\` — no admin rights required.

          The installer is not code-signed yet, so Windows SmartScreen will warn on
          first run. Verify the download instead:

          \`\`\`
          SHA256: $SHA256
          \`\`\`
          \`\`\`powershell
          Get-FileHash -Algorithm SHA256 .\\MTGOTools_Setup_v$VERSION.exe
          \`\`\`
          EOF

          # --notes is prepended to --generate-notes' changelog (gh documents
          # that pairing for --notes specifically, not --notes-file), so the
          # install instructions lead and the commit changelog follows.
          # The `.sha256` sidecar rides along as its own asset so the in-app
          # updater can fetch a ~100-byte checksum, verify the installer it just
          # downloaded, and refuse to execute a corrupt or tampered one -- no
          # parsing of the human-facing notes above required.
          gh release create "v$VERSION" \
            "dist/installer/MTGOTools_Setup_v$VERSION.exe" \
            "dist/installer/MTGOTools_Setup_v$VERSION.exe.sha256" \
            --title "MTGO Tools v$VERSION" \
            --notes "$(cat notes.md)" \
            --generate-notes

          echo "Published https://github.com/${{ github.repository }}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  prune:
    name: Prune superseded releases
    needs: [decide, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deletes the release and its ~180 MB installer, never the tag.
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prune_releases.py | tee -a "$GITHUB_STEP_SUMMARY"
